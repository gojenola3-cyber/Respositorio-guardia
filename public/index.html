<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guardia</title>
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guardia">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Entrar / registrarse -->
  <section id="view-auth" class="view" hidden>
    <div class="brand"><img src="/icon.svg" alt="" width="56" height="56"><h1>Guardia</h1></div>
    <div class="tabs">
      <button class="tab active" data-tab="login">Entrar</button>
      <button class="tab" data-tab="register">Apuntarme</button>
    </div>
    <form id="form-login" class="card">
      <label>Teléfono <input name="phone" type="tel" autocomplete="tel" required></label>
      <label>PIN <input name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <form id="form-register" class="card" hidden>
      <label>Nombre <input name="name" autocomplete="name" required></label>
      <label>Teléfono <input name="phone" type="tel" autocomplete="tel" required></label>
      <label>PIN (4-8 cifras) <input name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" autocomplete="new-password" required></label>
      <details>
        <summary>Soy responsable</summary>
        <label>Código de responsable <input name="responsableCode" autocomplete="off"></label>
      </details>
      <button class="btn primary" type="submit">Crear cuenta</button>
    </form>
    <p id="auth-error" class="error" role="alert"></p>
  </section>

  <!-- App -->
  <section id="view-app" class="view" hidden>
    <header class="topbar">
      <div>
        <strong id="me-name"></strong>
        <span id="me-role" class="chip"></span>
      </div>
      <button id="btn-logout" class="btn ghost small">Salir</button>
    </header>

    <div id="install-hint" class="card hint" hidden>
      En iPhone, para que te lleguen los avisos: botón <b>Compartir</b> → <b>Añadir a pantalla de inicio</b>, y abre la app desde el icono.
    </div>

    <!-- Emergencia activa (voluntario) -->
    <div id="volunteer-alert" class="card alert-card" hidden></div>

    <!-- Panel del responsable -->
    <div id="responsable" hidden>
      <div id="launch-card" class="card">
        <h2>Lanzar emergencia</h2>
        <form id="form-alert">
          <label>Qué pasa <input name="title" placeholder="Rescate en playa de Isuntza" maxlength="120" required></label>
          <label>Dónde (texto) <input name="address" placeholder="Puerto de Lekeitio" maxlength="200"></label>
          <label>Detalles <textarea name="description" rows="2" maxlength="1000" placeholder="Material, punto de encuentro..."></textarea></label>
          <p class="muted">Toca el mapa para marcar el punto de la emergencia.</p>
          <button type="button" id="btn-here" class="btn ghost small">Usar mi ubicación</button>
          <p class="muted" id="on-duty-count"></p>
          <button class="btn sos" type="submit">🚨 ACTIVAR EMERGENCIA</button>
        </form>
      </div>

      <div id="tracking-card" class="card" hidden>
        <div class="row between">
          <h2 id="tracking-title"></h2>
          <button id="btn-close-alert" class="btn ghost small">Cerrar emergencia</button>
        </div>
        <p id="tracking-meta" class="muted"></p>
        <div id="tracking-counts" class="counts"></div>
      </div>

      <div class="card map-card"><div id="map"></div></div>

      <div id="responders-card" class="card" hidden>
        <h2>Respuestas</h2>
        <ul id="responders" class="list"></ul>
      </div>

      <div class="card">
        <h2>Voluntarios</h2>
        <ul id="volunteers" class="list"></ul>
      </div>
    </div>
    <!-- Estado de guardia -->
    <div class="card">
      <h2>Guardia</h2>
      <button id="btn-duty" class="btn duty"></button>
      <p class="muted" id="duty-help"></p>
    </div>

    <div class="card">
      <h2>Avisos en el móvil</h2>
      <p id="push-status" class="muted"></p>
      <div class="row">
        <button id="btn-push" class="btn">Activar avisos</button>
        <button id="btn-test" class="btn ghost">Probar alarma</button>
      </div>
    </div>

  </section>

  <!-- Pantalla de alarma a pantalla completa -->
  <div id="alarm" class="alarm" hidden>
    <div class="alarm-inner">
      <div class="alarm-icon">🚨</div>
      <h1 id="alarm-title"></h1>
      <p id="alarm-address"></p>
      <p id="alarm-desc"></p>
      <div class="alarm-actions">
        <button id="alarm-go" class="btn go">VOY</button>
        <button id="alarm-nogo" class="btn nogo">NO PUEDO</button>
      </div>
      <button id="alarm-mute" class="btn ghost small light">Silenciar</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
