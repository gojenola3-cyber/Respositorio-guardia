# Configuración para la CLI de Supabase (desarrollo local: `supabase start`).
# En producción estos valores se fijan en el panel de Supabase; ver docs/DESPLIEGUE.md.
project_id = "guardia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Bandeja de correo local para probar invitaciones y recuperación de acceso.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "guardia://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cualquiera puede crear una cuenta, pero eso NO da acceso a ninguna
# organización: hace falta invitación o aprobación de un administrador.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30

[functions.dispatch]
# La función valida ella misma: las acciones de usuario pasan su JWT a las
# RPC (PostgreSQL decide) y "sweep" exige CRON_SECRET.
verify_jwt = false
